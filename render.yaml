services:
  - type: web
    name: checkmate-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate --schema prisma/schema.prisma
    preDeployCommand: npx prisma db push --schema prisma/schema.prisma
    startCommand: npm run server
    initialDeployHook: npm run db:seed
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MOCK_MODE
        value: "false"
      - key: PERSISTENCE_READY
        value: "true"
      - key: ENABLE_CRON
        value: "false"
      - key: CLIENT_ORIGIN
        value: https://building-sooty.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: VERIFICATION_PEPPER
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: checkmate-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: checkmate-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: checkmate-redis
    plan: starter
    ipAllowList: []

databases:
  - name: checkmate-postgres
    plan: starter
    databaseName: checkmate
    user: checkmate
