name: CheckMate CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check server/index.js

  deploy-vercel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Vercel Git integration
        run: |
          echo "Vercel is connected to the repository and deploys main automatically."
          echo "The deployment is intentionally not duplicated through the Vercel CLI."
      - name: Smoke test production frontend
        run: curl --fail --silent --show-error --location --max-time 20 https://building-sooty.vercel.app/ > /dev/null
